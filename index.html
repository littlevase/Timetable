function invalidateLoadMap(){_loadMapCache=null}
function buildLoadMap(){
  const m={}; data.teachers.forEach(t=>{m[t]=0});
  for(let pi=0;pi<data.periods.length;pi++){
    const byTeacher={};
    data.classes.forEach((c,ci)=>{
      const t1=c[4][pi];
      if(t1)(byTeacher[t1]=byTeacher[t1]||new Set()).add(ci);
      const s2=getSlot2(ci,pi);
      if(s2&&s2.teacher)(byTeacher[s2.teacher]=byTeacher[s2.teacher]||new Set()).add(ci);
    });
    for(const t in byTeacher){
      const set=byTeacher[t];
      if(set.size===0)continue;
      if(set.size===1){m[t]=(m[t]||0)+1;continue}
      const names=Array.from(set).map(ci=>data.classes[ci][0]);
      const covered=(data.conflictExceptions||[]).some(ex=>ex.period===pi&&ex.teacher===t&&ex.classes.length===names.length&&ex.classes.every(cn=>names.includes(cn)));
      m[t]=(m[t]||0)+(covered?1:set.size);
    }
  }
  return m;
}

  const phE=isFt?"8:45 AM":"8:50 AM";

    const t=times[i]||{start:"",end:""};
    let prevEnd="";

      {title:"Swap teachers",yesText:"Swap",icon:"🔄"}
    );

    map[otherName]=oldName;

      {title:"Similar name",yesText:`Use "${canonical}"`,noText:"Keep separate",icon:"🔤"}
    );
    if(useCanonical){

      data.teachers[i]=canonical;
      data.teachers[similarIdx]=oldName;

      toast(`Swapped "${oldName}" ↔ "${canonical}".`,"success");

function computeConflicts(){const result=data.periods.map((_,pi)=>{const perDay={};for(let d=0;d<data.daysPerWeek;d++){const teachers={};data.classes.forEach((c,ci)=>{const t1=c[4][pi];if(t1&&isSlot1ActiveOn(ci,pi,d)){(teachers[t1]=teachers[t1]||[]).push({ci,slot:1})}const s2=getSlot2(ci,pi);if(s2&&s2.mode!=="same"&&s2.teacher&&isSlot2ActiveOn(s2,d)){(teachers[s2.teacher]=teachers[s2.teacher]||[]).push({ci,slot:2})}});perDay[d]=teachers}const conflicts={};for(let d=0;d<data.daysPerWeek;d++){const teachers=perDay[d];Object.keys(teachers).forEach(t=>{const entries=teachers[t];if(entries.length>1){const classNames=entries.map(e=>data.classes[e.ci][0]);if(isExceptionSuppressed(pi,t,classNames,d))return;if(!conflicts[t])conflicts[t]={days:new Set(),classes:new Set()};conflicts[t].days.add(d);classNames.forEach(n=>conflicts[t].classes.add(n))}})}const out={};Object.keys(conflicts).forEach(t=>{out[t]={days:Array.from(conflicts[t].days).sort((a,b)=>a-b),classes:Array.from(conflicts[t].classes)}});return out});return result}
function collectTimetableIssues(){
  const issues = [];
  data.classes.forEach((c,ci)=>{
    data.periods.forEach((p,i)=>{
      const sub = (c[3][i]||"").trim();
      const tea = (c[4][i]||"").trim();
      if(!sub && !tea) issues.push({level:"warn", kind:"empty",    text:`${c[0]} · Period ${p}: no subject or teacher set.`});
      else if(!sub)    issues.push({level:"warn", kind:"no-subject",text:`${c[0]} · Period ${p}: teacher "${tea}" but no subject.`});
      else if(!tea)    issues.push({level:"warn", kind:"no-teacher",text:`${c[0]} · Period ${p}: subject "${sub}" but no teacher.`});
      const s2 = getSlot2(ci, i);
      if(s2){
        const s2sub=(s2.subject||"").trim(), s2tea=(s2.teacher||"").trim();
        if(!s2sub) issues.push({level:"warn", kind:"slot2-sub", text:`${c[0]} · Period ${p}: 2nd subject has no subject.`});
        if(s2.mode!=="same" && !s2tea) issues.push({level:"warn", kind:"slot2-tea", text:`${c[0]} · Period ${p}: 2nd subject "${s2sub}" has no teacher.`});
        if(s2.mode==="rotation" && (!Array.isArray(s2.days) || s2.days.length===0))
          issues.push({level:"warn", kind:"slot2-days", text:`${c[0]} · Period ${p}: rotation slot has no days ticked.`});
      }
    });
  });
  const conflicts = computeConflicts();
  conflicts.forEach((bad, pi)=>{
    Object.keys(bad).forEach(t=>{
      const info = bad[t];
      const dayTxt = daysLabel(info.days) || "every day";
      issues.push({level:"error", kind:"conflict", period:pi, teacher:t, text:`Period ${data.periods[pi]}: ${t} is in ${info.classes.join(", ")} — ${dayTxt}.`});
    });
  });
  data.periodTimes.forEach((pt,i)=>{
    if(!pt.start || !pt.end)
      issues.push({level:"info", kind:"time", text:`Period ${data.periods[i]}: time slot not set.`});
  });
  data.classes.forEach(c=>{
    if(!(c[1]||"").trim())
      issues.push({level:"info", kind:"incharge", text:`${c[0]}: no incharge assigned.`});
  });
  if(data.breakAfter && data.breakAfter >= data.periods.length)
    issues.push({level:"error", kind:"break", text:`Break is set after Period ${data.breakAfter}, but only ${data.periods.length} periods exist.`});
  return issues;
}

function isExceptionSuppressed(pi,teacher,classNames,dayIdx){const exs=data.conflictExceptions||[];const setA=new Set(classNames);return exs.some(ex=>{if(ex.period!==pi)return false;if(ex.teacher!==teacher)return false;if(!ex.days.includes(dayIdx))return false;if(ex.classes.length!==setA.size)return false;return ex.classes.every(c=>setA.has(c))})}
function classStatusFor(ci){
  const c=data.classes[ci];
  if(!c) return {state:"ok",label:"—"};
  let empty=0,incomplete=0;
  data.periods.forEach((p,i)=>{
    const sub=(c[3][i]||"").trim();
    const tea=(c[4][i]||"").trim();
    if(!sub&&!tea) empty++;
    else if(!sub||!tea) incomplete++;
  });
  const conflicts=computeConflicts();
  let conflictCount=0;
  data.periods.forEach((p,i)=>{ if(cellHasConflict(ci,i,conflicts)) conflictCount++; });
  if(conflictCount>0) return {state:"error",label:`🔴 ${conflictCount} conflict${conflictCount===1?"":"s"}`};
  if(empty||incomplete){
    const parts=[];
    if(empty) parts.push(`${empty} empty`);
    if(incomplete) parts.push(`${incomplete} incomplete`);
    return {state:"warn",label:`⚠️ ${parts.join(", ")}`};
  }
  return {state:"ok",label:"✅ Complete"};
}

/* ============================================================
   RANK/QUAL MATCHING FOR SUBSTITUTES
   ============================================================ */
function rankBadgesFor(t){const info=getTeacherInfo(t);const parts=[];if(info.rank)parts.push(info.rank);if(info.qual)parts.push(info.qual);return parts.length?` (${esc(parts.join(" "))})`:""}
function rankBadgesTextFor(t){const info=getTeacherInfo(t);const parts=[];if(info.rank)parts.push(info.rank);if(info.qual)parts.push(info.qual);return parts.join(" · ")||"no group/grade"}
function compareQualRank(absTeacher,candTeacher){
  /* Score tiers:
     0 = same rank + same qual  (best)
     1 = same rank, different qual
     2 = same qual, different rank
     3 = same rank only
     4 = same qual only
     5 = fallback
  */
  const A=getTeacherInfo(absTeacher);const B=getTeacherInfo(candTeacher);
  const sameRank=!!A.rank&&!!B.rank&&A.rank===B.rank;
  const sameQual=!!A.qual&&!!B.qual&&A.qual===B.qual;
  if(sameRank&&sameQual)return 0;
  if(sameRank)return 1;
  if(sameQual)return 2;
  if(A.rank&&!B.rank)return 3;
  if(A.qual&&!B.qual)return 4;
  return 5;
}
function rankSubstitutesForAbsent(absTeacher,freeList){
  /* Returns up to 4 best matches with their tier */
  if(!freeList||!freeList.length)return"";
  const scored=freeList.map(t=>({t,tier:compareQualRank(absTeacher,t),load:getTeacherTotalPeriods(t)})).sort((a,b)=>a.tier-b.tier||a.load-b.load||a.t.localeCompare(b.t));
  const top=scored.slice(0,4);
  return top.map(x=>`${esc(x.t)} [${esc(rankBadgesTextFor(x.t))}]`).join(" • ")
}
function substituteQualColumnHTML(absTeacher,freeList){
  if(!freeList||!freeList.length)return '<span class="muted">—</span>';
  const scored=freeList.map(t=>({t,tier:compareQualRank(absTeacher,t),load:getTeacherTotalPeriods(t)})).sort((a,b)=>a.tier-b.tier||a.load-b.load||a.t.localeCompare(b.t));
  const top=scored.slice(0,4);
  return top.map((x,i)=>`<div style="margin:2px 0">${i+1}. <b>${esc(x.t)}</b> ${rankBadgesFor(x.t)}</div>`).join("");
}

async function downloadAllTeachersImages(){
  const list=teachersForTimetable();
  if(!list.length){toast("No teachers to export.","error");return}
  const ok=await uiConfirm(`Download ${list.length} image${list.length===1?"":"s"} — one per teacher?\n\nYour browser will ask permission to download multiple files the first time. Tap Allow.\n\nKeep this tab open until the progress bar finishes.`,"Download All Teachers","Download");
  if(!ok)return;
  const original=selectedTeacher;
  let count=0;
  const total=list.length;
  for(let idx=0; idx<total; idx++){
    const t=list[idx];
    showProgressToast(`Generating ${idx+1} of ${total} — ${t}`);
    try{
      selectedTeacher=t;
      const canvas=await makeTimetableCanvas("teacher");
      await new Promise(resolve=>{
        canvas.toBlob(blob=>{
          if(!blob){resolve();return}
          const url=URL.createObjectURL(blob);
          const a=document.createElement("a");
          a.href=url;
          a.download=`timetable-${t.replace(/\s+/g,"-")}-${new Date().toISOString().slice(0,10)}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(()=>URL.revokeObjectURL(url),3000);
          count++;
          resolve();
        },"image/png");
      });
    }catch(e){
      console.warn("Could not export",t,e);
    }
    if(idx<total-1) await new Promise(r=>setTimeout(r,350));
  }
  selectedTeacher=original;
  hideProgressToast();
  if(count===total) toast(`Downloaded all ${count} images.`,"success");
  else if(count>0) toast(`Downloaded ${count} of ${total} images.`,`info`);
  else toast("Could not generate any images.","error");
}

    const innerW = 281 - padMM * 2;
    const innerH = 193 - padMM * 2;
    const boxW = ((innerW - gapMM * (cols - 1)) / cols).toFixed(2);
    const boxH = ((innerH - gapMM * (rows - 1)) / rows).toFixed(2);

    const tds1 = 'padding:0 2px; border:1px solid #999; font-size:8pt; font-weight:bold; text-align:center; width:20%; vertical-align:middle; box-sizing:border-box; overflow:hidden; line-height:1.1;';
    const tds2 = 'padding:0 3px; border:1px solid #999; font-size:8pt; text-align:left; vertical-align:middle; box-sizing:border-box; overflow:hidden; word-break:break-word; line-height:1.1;';

    let html = '';
    for (let i = 0; i < teachers.length; i += perPage) {
        const pageTeachers = teachers.slice(i, i + perPage);
        let boxesHTML = '';
        for (let j = 0; j < perPage; j++) {
            const t = pageTeachers[j];
            if (t) {
                const trs = data.periods.map((p, pi) => {
                    return '<tr style="height:1px;"><td style="' + tds1 + '">' + p + '</td><td style="' + tds2 + '">' + esc(teacherPeriodSummary(t, pi)) + '</td></tr>';
                }).join('');
                boxesHTML += '<div style="border:1px dashed #000; padding:1.5mm; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; background:#fff; width:' + boxW + 'mm; height:' + boxH + 'mm;">'
                    + '<div style="flex:0 0 auto; text-align:center; font-weight:bold; font-size:9.5pt; border-bottom:1px solid #000; padding-bottom:0.5mm; margin-bottom:1mm;">' + esc(t) + '</div>'
                    + '<div style="flex:1 1 auto; min-height:0; display:flex; flex-direction:column;">'
                    + '<table style="width:100%; height:100%; border-collapse:collapse; table-layout:fixed; flex:1;">'
                    + '<tbody style="height:100%;">' + trs + '</tbody></table>'
                    + '</div></div>';
            } else {
                boxesHTML += '<div style="width:' + boxW + 'mm; height:' + boxH + 'mm; box-sizing:border-box;"></div>';
            }
        }
        html += '<div class="print-sheet fixed-sheet" style="padding:0 !important; overflow:hidden !important;">'
             +  '<div style="padding:' + padMM + 'mm; box-sizing:border-box; display:grid; grid-template-columns:repeat(' + cols + ', ' + boxW + 'mm); grid-template-rows:repeat(' + rows + ', ' + boxH + 'mm); gap:' + gapMM + 'mm; width:100%; justify-content:center;">'
             +  boxesHTML
             +  '</div></div>';
    }
    setPrint(html);
}

}

function printTeacher(){let t=document.getElementById("pt").value;setPrint(`<div class="print-sheet fixed-sheet teacher-sheet">${teacherHTML(t)}</div>`)}
function printClassroom(){let c=data.classes.find(x=>x[0]===document.getElementById("pc").value);setPrint(`<div class="print-sheet fixed-sheet class-sheet">${classHTML(c)}</div>`)}
function printAllClassrooms(){setPrint(data.classes.map(c=>`<div class="print-sheet fixed-sheet class-sheet">${classHTML(c)}</div>`).join(""))}
function applyPrintOrientation(){var id="dynamicPrintPage";var s=document.getElementById(id);if(!s){s=document.createElement("style");s.id=id;document.head.appendChild(s);}var portrait=data.printOrientation==="portrait";var size=portrait?"A4 portrait":"A4 landscape";var h=portrait?"272mm":"186mm";s.textContent="@media print{@page{size:"+size+";margin:8mm}.print-sheet.timings-page{height:"+h+"!important;min-height:"+h+"!important;max-height:"+h+"!important;overflow:hidden!important}}";}
function setPrint(content){const area=document.getElementById("printArea");const mult=(PRINT_SIZES[data.printSize]||PRINT_SIZES.m).mult;const sMult=(PRINT_SIZES[data.stripSize]||PRINT_SIZES.m).mult;area.style.setProperty("--mult",mult);area.style.setProperty("--s-mult",sMult);area.innerHTML=content;area.style.display="block";requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()))}
window.onafterprint=()=>{document.getElementById("printArea").innerHTML="";document.getElementById("printArea").style.display="none"};
applyPrintOrientation();
